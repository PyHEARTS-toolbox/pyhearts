name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests + coverage
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest tests/ --cov=pyhearts --cov-report=term-missing --cov-report=xml --durations=10

      - name: Upload coverage.xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install and import wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import pyhearts; assert pyhearts.__version__ == '2.0.0'"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: pyhearts-distributions
          path: dist/*


